const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){const te=new TextEncoder();const base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(D.salt),iterations:600000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(D.iv)},key,ub(D.ct));const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close();}
const saved=localStorage.getItem('dash_pw');if(saved)open(saved).catch(()=>localStorage.removeItem('dash_pw'));
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const pw=document.getElementById('pw').value;document.getElementById('err').textContent='여는 중...';
const rem=document.getElementById('rem').checked;try{await open(pw);if(rem)localStorage.setItem('dash_pw',pw);}catch(x){document.getElementById('err').textContent='비밀번호가 맞지 않습니다.';}};
